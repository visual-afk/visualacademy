<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>2000플랜 워크시트</title>
<style>html,body{margin:0;background:#fff}</style>
<script>
/* 비주얼아카데미 강의 플레이어 연결 (scripts/sync-worksheet-widgets.mjs 가 붙임) */
(function () {
  var q = new URLSearchParams(location.search);
  var EMAIL = q.get("email") || "", LECTURE = Number(q.get("lecture")) || 0;
  function post(m) { m.source = "va-worksheet"; try { parent.postMessage(m, location.origin); } catch (e) {} }
  var orig = window.fetch;
  window.fetch = function (input) {
    var p = orig.apply(this, arguments);
    var url = String((input && input.url) || input);
    if (/\/submit$/.test(url)) p.then(function (r) { r.clone().json().then(function (d) { if (r.ok && d && d.success !== false) post({ type: "submitted" }); }).catch(function () {}); }).catch(function () {});
    return p;
  };
  function fill() {
    if (!EMAIL) return;
    ["wsEmail", "f_email"].forEach(function (id) { var el = document.getElementById(id); if (el && !el.value) el.value = EMAIL; });
  }
  var n = 0, t = setInterval(function () { fill(); if (++n > 60) clearInterval(t); }, 500);
  document.addEventListener("focusin", fill);
  function height() { post({ type: "height", h: document.documentElement.scrollHeight }); }
  window.addEventListener("load", function () {
    if (LECTURE && window.wsSelectLecture) {
      window.wsSelectLecture(LECTURE);
      if (EMAIL && window.wsCheckEmail) { document.getElementById("wsEmail").value = EMAIL; window.wsCheckEmail(); }
    }
    height();
    if (window.ResizeObserver) new ResizeObserver(height).observe(document.body);
  });
})();
</script>
</head>
<body>
<!-- ★ 아임웹 'PART 1' 강의 페이지 코드 위젯에 이 전체를 붙여넣으세요 ★ -->
<!-- ※ 이 파일은 PART 1 전용입니다. 다른 파트는 widget-part2.html ~ widget-part6.html을 쓰세요. -->
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

/* ★ 변수는 강의카드(.ws-wrap)와 팝업(.ws-overlay) 양쪽에 모두 정의해야 함 —
   팝업은 .ws-wrap 바깥 형제라서, 여기 빠지면 팝업 안 색이 전부 투명으로 풀림 */
.ws-wrap,.ws-overlay{
  --ws-blue:#0CA678; --ws-blue-hover:#0A8C63; --ws-blue-soft:#E3FBF1;
  --ws-ink:#191F28; --ws-body:#3D4754; --ws-sub:#6B7684; --ws-hint:#98A2AF;
  --ws-line:#CDD3D9; --ws-fill:#EEF1F4; --ws-fill-2:#F7F9FA;
  --ws-red:#F04452;
}
.ws-wrap{
  font-family:'Pretendard',-apple-system,sans-serif;max-width:600px;margin:40px auto;padding:0 20px;box-sizing:border-box;color:var(--ws-ink)}
.ws-wrap *,.ws-overlay *{box-sizing:border-box;margin:0;padding:0}
.ws-overlay,.ws-overlay *{color:var(--ws-ink)}
/* 아임웹 테마 폰트/굵기 덮어쓰기 방지 — Pretendard·굵기 강제 (팝업 포함) */
.ws-wrap,.ws-wrap *,.ws-overlay,.ws-overlay *{font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,sans-serif !important;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.ws-section-title,.ws-badge,.ws-h2,.ws-num,.ws-part-num,.ws-done-title{font-weight:800 !important}
.ws-lbl,.ws-btn,.ws-part-title,.ws-done-desc em,.ws-req,.ws-btn-primary{font-weight:700 !important}
.ws-btn-back,.ws-counter.ok{font-weight:600 !important}
.ws-section-sub,.ws-sub,.ws-note,.ws-done-desc,.ws-inp,.ws-part-score,.ws-hint,.ws-counter{font-weight:400 !important}
.ws-err{font-weight:500 !important}
/* 폰트 사이즈도 강제 (아임웹이 태그에 !important로 크기를 박아도 방어 — 특히 입력칸 16px=iOS 확대 방지) */
.ws-section-title{font-size:24px !important}
.ws-h2{font-size:23px !important;line-height:1.35 !important}
.ws-done-title{font-size:22px !important}
.ws-inp,.ws-btn{font-size:16px !important}
.ws-section-sub,.ws-sub,.ws-lbl,.ws-done-desc{font-size:15px !important}
.ws-part-title{font-size:14px !important}
.ws-err{font-size:13.5px !important}
.ws-note{font-size:13px !important}
.ws-hint{font-size:12.5px !important}
.ws-badge,.ws-part-score,.ws-counter{font-size:12px !important}
.ws-part-num,.ws-num{font-size:11px !important}
.ws-soon{font-size:10px !important}

/* 아임웹 테마가 button/input 배경·색·테두리를 덮는 것 방지 — 핵심 색 강제 */
.ws-btn{border:none !important;box-shadow:none !important}
.ws-btn-primary{background:var(--ws-blue) !important;color:#fff !important}
.ws-btn-primary:hover:not(:disabled){background:var(--ws-blue-hover) !important}
.ws-btn-back{background:transparent !important;color:var(--ws-sub) !important}
.ws-btn-back:hover:not(:disabled){color:var(--ws-body) !important}
.ws-inp{background:var(--ws-fill-2) !important;border:1px solid var(--ws-line) !important;color:var(--ws-ink) !important;border-radius:12px !important}
.ws-inp:focus{border-color:var(--ws-blue) !important;background:#fff !important}
.ws-inp::placeholder{color:var(--ws-hint) !important}
.ws-badge{background:var(--ws-blue-soft) !important;color:var(--ws-blue) !important}
.ws-part-card{background:#fff !important;border:1px solid var(--ws-line) !important}
.ws-num{background:var(--ws-blue) !important;color:#fff !important}
.ws-close{background:var(--ws-fill) !important;color:var(--ws-sub) !important;border:none !important}
.ws-popup{background:#fff !important}
.ws-done-icon{background:var(--ws-blue-soft) !important;color:var(--ws-blue) !important}

/* ===== 가독성 업그레이드 (토스 스타일) — 문항 텍스트·여백 ===== */
/* 문항 라벨: 번호를 왼쪽으로 분리(flex)하고, 긴 질문도 편하게 읽히게 키움 */
#wsQuestions .ws-lbl{display:flex;align-items:flex-start;gap:11px;font-size:16.5px !important;font-weight:600 !important;line-height:1.62 !important;color:var(--ws-ink) !important;margin-bottom:13px;letter-spacing:-0.2px}
#wsQuestions .ws-num{margin-right:0 !important;margin-top:2px;width:24px !important;height:24px !important;border-radius:8px}
/* 문항 사이 간격 넉넉히 */
#wsQuestions .ws-field{margin-bottom:30px;padding-bottom:30px;border-bottom:1px solid var(--ws-fill)}
#wsQuestions .ws-field:last-child{border-bottom:none;padding-bottom:0}
/* 입력칸/설명 더 편하게 */
textarea.ws-inp{min-height:150px !important;line-height:1.8 !important;padding:16px 17px !important}
.ws-hint{font-size:13px !important;line-height:1.6 !important;margin-top:9px}
.ws-counter{font-size:12.5px !important;margin-top:8px}
/* 문항 단계 상단 안내문도 한 톤 또렷하게 */
#wsStep1 .ws-sub{color:var(--ws-body) !important;line-height:1.65 !important}

/* ===== 문항 비교 카드 (A vs B 등을 직관적으로) ===== */
.ws-compare{display:flex;align-items:stretch;gap:9px;margin:2px 0 18px}
.ws-cmp-card{flex:1;min-width:0;background:var(--ws-fill-2) !important;border:1px solid var(--ws-line) !important;border-radius:14px;padding:14px 13px}
.ws-cmp-head{font-size:14px !important;font-weight:700 !important;color:var(--ws-ink) !important;text-align:center;padding-bottom:10px;margin-bottom:11px;border-bottom:1px solid var(--ws-line)}
.ws-cmp-stats{list-style:none !important;margin:0 !important;padding:0 !important;display:flex;flex-direction:column;gap:9px}
.ws-cmp-stats li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px !important;font-weight:400 !important;line-height:1.3 !important;padding:0 !important;margin:0 !important}
.ws-cmp-stats li span{color:var(--ws-sub) !important;font-weight:400 !important}
.ws-cmp-stats li strong{color:var(--ws-ink) !important;font-weight:700 !important}
.ws-cmp-stats li.hot strong{color:var(--ws-blue) !important}
.ws-cmp-vs{flex:0 0 auto;align-self:center;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--ws-blue-soft) !important;color:var(--ws-blue) !important;font-size:11px !important;font-weight:800 !important}
@media(max-width:380px){.ws-cmp-card{padding:12px 10px}.ws-cmp-stats li{font-size:12.5px !important}}

/* ===== 문항 단계 안내 (6단계 등 보기 리스트) ===== */
.ws-steps{display:flex;flex-direction:column;gap:9px;margin:2px 0 16px;padding:15px 15px;background:var(--ws-fill-2) !important;border:1px solid var(--ws-line) !important;border-radius:14px}
.ws-steps-cap{font-size:12.5px !important;font-weight:700 !important;color:var(--ws-sub) !important;letter-spacing:0.2px;margin-bottom:2px}
.ws-step{display:flex;align-items:center;gap:11px;font-size:14.5px !important;font-weight:500 !important;color:var(--ws-ink) !important;line-height:1.35 !important;margin:0 !important;padding:0 !important}
.ws-step-no{flex:0 0 auto;width:23px;height:23px;border-radius:7px;background:var(--ws-blue-soft) !important;color:var(--ws-blue) !important;display:flex;align-items:center;justify-content:center;font-size:11px !important;font-weight:800 !important}

/* 섹션 타이틀 */
.ws-section-title{font-size:24px;font-weight:800;color:var(--ws-ink);margin-bottom:8px;letter-spacing:-0.5px}
.ws-section-sub{font-size:15px;color:var(--ws-sub);margin-bottom:24px;line-height:1.6}

/* 강의 선택 그리드 */
.ws-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:480px){.ws-grid{grid-template-columns:repeat(4,1fr);gap:8px}}

.ws-part-card{background:#fff;border:1px solid var(--ws-line);border-radius:16px;padding:22px 16px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s;text-align:center;position:relative;overflow:hidden}
.ws-part-card:hover{border-color:var(--ws-blue);box-shadow:0 6px 16px rgba(12,166,120,0.16);transform:translateY(-2px)}
.ws-part-card.locked{opacity:0.5;cursor:not-allowed;background:var(--ws-fill-2)}
.ws-part-card.locked:hover{transform:none;border-color:var(--ws-line);box-shadow:none}
.ws-part-card.done{border-color:var(--ws-blue)}
.ws-part-card.done::after{content:'✓';position:absolute;top:10px;right:13px;color:var(--ws-blue);font-size:14px;font-weight:800}
.ws-part-num{font-size:11px;font-weight:800;color:var(--ws-blue);letter-spacing:1px;margin-bottom:7px}
.ws-part-title{font-size:14px;font-weight:700;color:var(--ws-ink);line-height:1.4;min-height:38px;display:flex;align-items:center;justify-content:center}
.ws-part-score{font-size:12px;color:var(--ws-sub);margin-top:9px}
.ws-part-score em{color:var(--ws-blue);font-style:normal;font-weight:700}

/* 팝업 오버레이 */
.ws-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:99999;align-items:center;justify-content:center;padding:16px;overscroll-behavior:contain}
.ws-overlay.active{display:flex}

/* 팝업 본체 */
.ws-popup{background:#fff;border-radius:24px;width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;padding:36px 28px 28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.18);animation:wsUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes wsUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.ws-popup{padding:28px 20px 20px;border-radius:20px;max-height:92vh;max-height:92dvh}}

/* 닫기 */
.ws-close{position:absolute;top:16px;right:18px;background:var(--ws-fill);border:none;color:var(--ws-sub);font-size:18px;line-height:1;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ws-close:hover{color:var(--ws-ink);background:#E5E8EB}

/* 헤더 */
.ws-badge{display:inline-block;background:var(--ws-blue-soft);color:var(--ws-blue);font-size:12px;font-weight:800;padding:6px 12px;border-radius:8px;letter-spacing:0.3px;margin-bottom:16px}
.ws-h2{font-size:23px;font-weight:800;color:var(--ws-ink);margin-bottom:8px;letter-spacing:-0.5px;line-height:1.35}
.ws-sub{font-size:15px;color:var(--ws-sub);line-height:1.6;margin-bottom:28px}
.ws-sub strong{color:var(--ws-body);font-weight:700}

/* 필드 */
.ws-field{margin-bottom:24px}
.ws-lbl{display:block;font-size:15px;font-weight:700;color:var(--ws-ink);margin-bottom:10px;line-height:1.5}
.ws-req{color:var(--ws-red);margin-left:3px}
.ws-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--ws-blue);color:#fff;border-radius:7px;font-size:11px;font-weight:800;margin-right:9px;flex-shrink:0;vertical-align:middle}
.ws-inp{width:100%;padding:15px 16px;background:var(--ws-fill-2);border:1px solid var(--ws-line);border-radius:12px;color:var(--ws-ink);font-size:16px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.ws-inp:focus{border-color:var(--ws-blue);background:#fff;box-shadow:0 0 0 4px rgba(12,166,120,0.16)}
.ws-inp::placeholder{color:var(--ws-hint)}
textarea.ws-inp{min-height:130px;resize:vertical;line-height:1.7}
.ws-hint{margin-top:7px;font-size:12.5px;color:var(--ws-sub);line-height:1.5}

/* 글자수 */
.ws-counter{text-align:right;font-size:12px;color:var(--ws-hint);margin-top:6px}
.ws-counter.warn{color:#FF9500}
.ws-counter.ok{color:var(--ws-blue);font-weight:600}

/* 버튼 */
.ws-btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s,transform .1s,opacity .2s;margin-top:8px}
.ws-btn:active{transform:scale(0.985)}
.ws-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}
.ws-btn-primary{background:var(--ws-blue);color:#fff}
.ws-btn-primary:hover:not(:disabled){background:var(--ws-blue-hover)}
.ws-btn-back{background:transparent;color:var(--ws-sub);margin-top:6px;font-weight:600}
.ws-btn-back:hover:not(:disabled){color:var(--ws-body)}

/* 에러 */
.ws-err{background:rgba(240,68,82,0.07);border-radius:12px;padding:13px 16px;font-size:13.5px;color:var(--ws-red);margin-bottom:18px;display:none;line-height:1.5;font-weight:500}
.ws-err.show{display:block;animation:wsFade .25s ease-out}
/* 검증에 걸린 입력칸 — 어느 문항이 문제인지 바로 보이게 */
.ws-inp.ws-inp-bad{border-color:var(--ws-red) !important;background:rgba(240,68,82,0.06) !important}

/* 하단 안내 */
.ws-note{text-align:center;font-size:13px;color:var(--ws-sub);margin-top:18px;line-height:1.7}

/* 스피너 */
.ws-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:wsSpin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes wsSpin{to{transform:rotate(360deg)}}

/* 화면 전환 */
.ws-screen{display:none}
.ws-screen.active{display:block;animation:wsFade .3s ease-out}
@keyframes wsFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 완료 */
.ws-done-icon{width:64px;height:64px;margin:8px auto 20px;background:var(--ws-blue-soft);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--ws-blue)}
.ws-done-title{font-size:22px;font-weight:800;color:var(--ws-ink);text-align:center;margin-bottom:10px;letter-spacing:-0.4px}
.ws-done-desc{font-size:15px;color:var(--ws-body);text-align:center;line-height:1.7}
.ws-done-desc em{color:var(--ws-blue);font-style:normal;font-weight:700}

/* 강의 준비중 */
.ws-soon{font-size:10px;color:var(--ws-hint);margin-top:4px}

/* 스크롤바 */
.ws-popup::-webkit-scrollbar{width:5px}
.ws-popup::-webkit-scrollbar-thumb{background:var(--ws-line);border-radius:4px}
</style>

<!-- ========== 이 파트의 강의 카드 (페이지에 바로 노출) ========== -->
<div class="ws-wrap">
  <h2 class="ws-section-title" id="wsPartTitle">📝 워크시트 AI 채점</h2>
  <p class="ws-section-sub">채점받을 강의를 골라주세요. 강의를 듣고 워크시트를 작성하면, AI가 맞춤 피드백을 보내드려요.</p>
  <div class="ws-grid" id="wsLectureGrid"><!-- JS로 생성 --></div>
</div>

<!-- ========== 팝업 오버레이 ========== -->
<div class="ws-overlay" id="wsOverlay">
  <div class="ws-popup" id="wsPopup">
    <button class="ws-close" onclick="wsClose()">&times;</button>

    <!-- STEP 0: 이메일 -->
    <div class="ws-screen active" id="wsStep0">
      <div class="ws-badge" id="wsBadge0">PART 1</div>
      <h2 class="ws-h2" id="wsTitle0">워크시트 채점받기</h2>
      <p class="ws-sub">결제하실 때 등록한 이메일을 입력해주세요.</p>
      <div class="ws-err" id="wsErr0"></div>
      <div class="ws-field">
        <label class="ws-lbl">이메일<span class="ws-req">*</span></label>
        <input type="email" class="ws-inp" id="wsEmail" placeholder="example@email.com" />
      </div>
      <button class="ws-btn ws-btn-primary" id="wsCheckBtn" onclick="wsCheckEmail()">다음</button>
      <button class="ws-btn ws-btn-back" onclick="wsClose()">강의 다시 선택</button>
      <div class="ws-note"><strong style="color:var(--ws-blue);font-weight:700">빨간펜 이유경AI</strong>가 채점해서 이메일로 보내드려요</div>
    </div>

    <!-- STEP 1: 문항 -->
    <div class="ws-screen" id="wsStep1">
      <div class="ws-badge" id="wsBadge1">PART 1</div>
      <h2 class="ws-h2">워크시트 작성</h2>
      <p class="ws-sub"><span id="wsUserName">회원</span>님, <strong>실제 상황</strong>을 기반으로 솔직하게 작성해주세요.</p>
      <div class="ws-err" id="wsErr1"></div>
      <div id="wsQuestions"><!-- JS로 생성 --></div>
      <div class="ws-err" id="wsErr1b"></div>
      <button class="ws-btn ws-btn-primary" id="wsSubmitBtn" onclick="wsSubmit()">채점 받기</button>
      <button class="ws-btn ws-btn-back" onclick="wsGoStep(0)">이메일 다시 입력</button>
      <div class="ws-note" id="wsAttemptNote">강의당 최대 3회까지 재제출할 수 있어요</div>
    </div>

    <!-- STEP 2: 완료 -->
    <div class="ws-screen" id="wsStep2">
      <div class="ws-done-icon">✓</div>
      <h3 class="ws-done-title">제출 완료했어요</h3>
      <p class="ws-done-desc">
        AI가 채점을 시작했어요.<br>
        <em id="wsDoneEmail">이메일</em>로 결과를 보내드릴게요.<br><br>
        <span id="wsDoneWhen">잠시 뒤 도착해요</span> · <em>스팸함도 한 번 확인해주세요</em>
      </p>
      <div class="ws-note" style="margin-top:22px">남은 재제출 <strong style="color:var(--ws-blue);font-weight:700" id="wsRemain">2회</strong></div>
      <button class="ws-btn ws-btn-primary" onclick="wsClose()" style="margin-top:20px">확인</button>
    </div>

  </div>
</div>

<script>
(function(){

  /* ★★★ 이 파일은 PART 1 전용 ★★★ */
  var PART_ONLY = Number(new URLSearchParams(location.search).get('part')) || 1;

  /* 설정 */
  var API_URL = 'https://2000plan-worksheet.visual-f2e.workers.dev';
  var REGISTER_URL = 'https://visualacademy.co.kr/95';   // 내 정보(사전) 등록 페이지
  var MAX_ATTEMPTS = 3;

  /* 파트 구성 — 제목과 강의 수 (총 44강) */
  var PARTS = [
    { num:1, title:'매출 현황 분석',   lectures:8 },
    { num:2, title:'시그니처 전략', lectures:6 },
    { num:3, title:'이미지 세팅'  ,     lectures:7 },
    { num:4, title:'마케팅 (신규 고객 유치)', lectures:8 },
    { num:5, title:'재방문 설계', lectures:8 },
    { num:6, title:'세일즈 & 객단가 전략', lectures:6 }
  ];

  var state = { partIdx:PART_ONLY-1, lecture:0, email:'', questions:[], needsProfile:false, attempt:1, maxAttempts:MAX_ATTEMPTS };
  var wsPrevBodyOverflow = '';

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  /* 준비된(콘텐츠 입력 완료) 강의. 백엔드 /catalog가 응답하면 덮어씀.
     예전엔 여기가 6개 파일 전부 파트1로 하드코딩돼 있어서, /catalog를 못 받으면
     파트2~6 페이지의 모든 강의가 "준비중"으로 잠겨 페이지가 통째로 죽어 보였다.
     못 받으면 이 파트 전 강의를 열어둔다 — 미준비 강의는 어차피 /verify가
     "아직 준비되지 않은 강의입니다"로 걸러준다. */
  var READY = (function(){
    var d = {}, n = (PARTS[PART_ONLY-1] || {}).lectures || 8;
    for(var l=1; l<=n; l++) d[PART_ONLY+'-'+l] = true;
    return d;
  })();
  function isReady(part, lec){ return !!READY[part+'-'+lec]; }

  /* 이 파트의 제목 표시 */
  var P = PARTS[state.partIdx];
  document.getElementById('wsPartTitle').textContent = '📝 PART '+P.num+' · '+P.title;

  /* 강의 카드 렌더 (페이지에 바로) */
  function renderLectures(){
    var p = PARTS[state.partIdx];
    var list = document.getElementById('wsLectureGrid');
    list.innerHTML = '';
    for(var l=1; l<=p.lectures; l++){
      (function(lec){
        var ready = isReady(p.num, lec);
        var done = ready && wsIsDone(p.num, lec);
        var b = document.createElement('div');
        b.className = 'ws-part-card' + (ready ? '' : ' locked') + (done ? ' done' : '');
        if(done) b.title = '이 기기에서 제출을 마친 강의예요';
        b.style.padding = '18px 8px';
        b.innerHTML = '<div class="ws-part-num" style="margin:0">'+lec+'강</div>' +
          (ready ? '' : '<div class="ws-soon">준비중</div>');
        if(ready) b.onclick = function(){ wsSelectLecture(lec); };
        list.appendChild(b);
      })(l);
    }
  }
  renderLectures();

  /* /catalog로 준비된 강의 갱신 */
  fetch(API_URL+'/catalog').then(function(r){return r.json()}).then(function(d){
    if(d && d.ready){ READY = {}; d.ready.forEach(function(x){ READY[x.part+'-'+x.lecture]=true; }); renderLectures(); }
  }).catch(function(){});

  /* 강의 선택 → 팝업 열고 이메일 단계 */
  window.wsSelectLecture = function(lec){
    state.lecture = lec;
    var p = PARTS[state.partIdx];
    document.getElementById('wsBadge0').textContent = 'PART '+p.num+' · '+lec+'강';
    document.getElementById('wsBadge1').textContent = 'PART '+p.num+' · '+lec+'강';
    document.getElementById('wsTitle0').textContent = lec+'강 워크시트 채점받기';
    if(state.email) document.getElementById('wsEmail').value = state.email;
    document.getElementById('wsOverlay').classList.add('active');
    wsPrevBodyOverflow = document.body.style.overflow;   // 아임웹 테마/다른 위젯이 넣어둔 값 보존
    document.body.style.overflow = 'hidden';
    wsGoStep(0);
  };

  /* 문항 작성 화면인지 */
  function wsOnWriting(){
    var s = document.getElementById('wsStep1');
    return !!(s && s.classList.contains('active'));
  }
  /* 작성 중인 답변이 하나라도 있는지 */
  function wsHasDraft(){
    for(var i=0;i<state.questions.length;i++){
      var el=document.getElementById('wsA_'+state.questions[i].key);
      if(el && el.value.trim()) return true;
    }
    return false;
  }

  /* 팝업 닫기 — 작성 중이면 한 번 확인 (실수로 닫혀 내용 날아가는 것 방지) */
  window.wsClose = function(force){
    if(force !== true && wsOnWriting() && wsHasDraft()){
      if(!confirm('작성 중인 내용이 있어요. 쓴 내용은 임시 저장되지만, 지금 창을 닫을까요?')) return;
    }
    document.getElementById('wsOverlay').classList.remove('active');
    document.body.style.overflow = wsPrevBodyOverflow;
  };

  /* 어두운 배경 클릭으로 닫기 —
     ① 문항 작성 화면에서는 아예 닫지 않는다 (오타 터치 한 번에 내용이 날아가던 원인)
     ② 팝업 안에서 드래그(텍스트 선택)를 시작해 바깥에서 손을 뗀 경우도 닫지 않는다 */
  var wsDownOnBackdrop = false;
  document.getElementById('wsOverlay').addEventListener('mousedown',function(e){ wsDownOnBackdrop = (e.target===this); });
  document.getElementById('wsOverlay').addEventListener('touchstart',function(e){ wsDownOnBackdrop = (e.target===this); },{passive:true});
  document.getElementById('wsOverlay').addEventListener('click',function(e){
    var ok = (e.target===this) && wsDownOnBackdrop && !wsOnWriting();
    wsDownOnBackdrop = false;
    if(ok) wsClose();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !wsOnWriting()) wsClose(); });

  /* 스텝 이동 (0:이메일 1:문항 2:완료) */
  window.wsGoStep = function(n){
    hideErr(0); hideErr(1);
    document.querySelectorAll('.ws-screen').forEach(function(el){el.classList.remove('active')});
    document.getElementById('wsStep'+n).classList.add('active');
    document.getElementById('wsPopup').scrollTop = 0;
  };

  /* 글자수 */
  window.wsCount = function(el,cntId,min){
    var len=el.value.trim().length;
    var cnt=document.getElementById(cntId);
    cnt.textContent=len+'자'+(min&&len<min?' (최소 '+min+'자)':' ✓');
    cnt.className='ws-counter'+(!min||len>=min?' ok':len>=min*0.6?' warn':'');
  };

  /* 에러 배너(#wsErr1)는 팝업 맨 위에 있고 제출 버튼은 긴 문항들 아래에 있다.
     그냥 보여주면 학생이 보고 있는 화면 '밖'에서 떴다가 5초 뒤 사라져서,
     "버튼을 눌러도 아무 반응이 없다"로 신고가 들어왔다. 그래서
     ① 제출 버튼 바로 위에 사본(#wsErr1b)을 하나 더 띄우고
     ② 그쪽으로 스크롤해 주고
     ③ 스스로 사라지지 않게 한다 (다음 시도 때 hideErr로 지움). */
  function wsShowBanner(el){
    el.classList.add('show');
    try{ el.scrollIntoView({behavior:'smooth', block:'center'}); }
    catch(e){ try{ el.scrollIntoView(); }catch(e2){} }
  }
  function showErr(n,msg){
    var el=document.getElementById('wsErr'+n);
    el.textContent=msg;
    var near=document.getElementById('wsErr'+n+'b');   // 제출 버튼 바로 위 사본
    if(near){ near.textContent=msg; near.classList.add('show'); }
    el.classList.add('show');
    wsShowBanner(near || el);
  }
  function hideErr(n){
    var el=document.getElementById('wsErr'+n);
    if(el){ el.classList.remove('show'); el.textContent=''; }
    var near=document.getElementById('wsErr'+n+'b');
    if(near){ near.classList.remove('show'); near.textContent=''; }
    var bad=document.querySelectorAll('.ws-inp-bad');
    for(var i=0;i<bad.length;i++) bad[i].classList.remove('ws-inp-bad');
  }
  /* 미등록/프로필 미등록 → 등록 페이지 안내 (링크 포함) */
  function showRegisterGuide(n,msg){
    var el=document.getElementById('wsErr'+n);
    el.innerHTML = esc(msg) +
      '<br><a href="'+REGISTER_URL+'" style="color:var(--ws-blue);font-weight:700;text-decoration:underline;display:inline-block;margin-top:7px">내 정보 등록하러 가기 →</a>';
    wsShowBanner(el);
  }

  /* 문항 비교 카드 — q.compare가 있으면 A/B 등을 표 형태로 직관적으로 렌더
     형식: q.compare = [{ head:'디자이너 A', stats:[{label:'경력',value:'3년'},{label:'월 예약',value:'8건',hot:true}] }, ...] */
  function wsCompareHtml(q){
    if(!q.compare || !q.compare.length) return '';
    var cards = q.compare.map(function(c){
      var rows = (c.stats||[]).map(function(s){
        return '<li'+(s.hot?' class="hot"':'')+'><span>'+esc(s.label)+'</span><strong>'+esc(s.value)+'</strong></li>';
      }).join('');
      return '<div class="ws-cmp-card"><div class="ws-cmp-head">'+esc(c.head)+'</div><ul class="ws-cmp-stats">'+rows+'</ul></div>';
    }).join('<div class="ws-cmp-vs">VS</div>');
    return '<div class="ws-compare">'+cards+'</div>';
  }

  /* 문항 단계 안내 — q.steps가 있으면 6단계 등을 번호 리스트로 보여줌
     형식: q.steps_title:'이천플랜 6단계', q.steps:['시그니처 설정', ...] */
  function wsStepsHtml(q){
    if(!q.steps || !q.steps.length) return '';
    var cap = q.steps_title ? '<div class="ws-steps-cap">'+esc(q.steps_title)+'</div>' : '';
    var items = q.steps.map(function(s, i){
      return '<div class="ws-step"><span class="ws-step-no">'+(i+1)+'</span>'+esc(s)+'</div>';
    }).join('');
    return '<div class="ws-steps">'+cap+items+'</div>';
  }

  /* 이 기기에서 제출을 마친 강의 기록 — 서버에 회차별 조회 API가 없어 로컬로만 표시한다.
     (다른 기기에서는 안 보이므로 이 표시로 클릭을 막지는 않는다) */
  function wsDoneKey(part, lec){ return 'ws2000:done:'+part+'-'+lec+':'+state.email; }
  function wsIsDone(part, lec){
    if(!state.email) return false;
    try{ return localStorage.getItem(wsDoneKey(part, lec)) === '1'; }catch(e){ return false; }
  }
  function wsMarkDone(){
    var p = PARTS[state.partIdx];
    try{ localStorage.setItem(wsDoneKey(p.num, state.lecture), '1'); }catch(e){}
    renderLectures();
  }

  /* 답변 임시 저장 — 창이 닫히거나 새로고침돼도 쓰던 내용이 남도록 */
  function wsDraftKey(){
    var p = PARTS[state.partIdx];
    return 'ws2000:' + p.num + '-' + state.lecture + ':' + state.email;
  }
  function wsSaveDraft(){
    var o = {};
    state.questions.forEach(function(q){
      var el = document.getElementById('wsA_'+q.key);
      if(el) o[q.key] = el.value;
    });
    try{ localStorage.setItem(wsDraftKey(), JSON.stringify(o)); }catch(e){}
  }
  function wsRestoreDraft(){
    var o = null;
    try{ o = JSON.parse(localStorage.getItem(wsDraftKey()) || 'null'); }catch(e){}
    if(!o) return;
    state.questions.forEach(function(q){
      var el = document.getElementById('wsA_'+q.key);
      if(el && o[q.key]){
        el.value = o[q.key];
        if(el.tagName === 'TEXTAREA') wsCount(el, 'wsCnt_'+q.key, q.min_len||0);
      }
    });
  }
  function wsClearDraft(){ try{ localStorage.removeItem(wsDraftKey()); }catch(e){} }

  /* 문항 렌더 — 백엔드 /verify가 내려준 questions로 생성 */
  function renderQuestions(questions){
    var wrap = document.getElementById('wsQuestions');
    wrap.innerHTML = '';
    questions.forEach(function(q, qi){
      var n = qi+1;
      var field = document.createElement('div');
      field.className = 'ws-field';
      var label = '<label class="ws-lbl"><span class="ws-num">'+n+'</span>'+esc(q.q)+'</label>' + wsCompareHtml(q) + wsStepsHtml(q);
      if(q.type === 'number'){
        field.innerHTML = label +
          /* type="number"를 쓰면 1,500 · 85% · 1 500 같은 입력을 브라우저가 무효로 보고
             el.value를 빈 문자열로 돌려준다 → 칸엔 글자가 보이는데 "작성해주세요"가 떠서
             제출이 막힌다. 서버는 답변을 문자열 그대로 저장하므로 text가 안전하다.
             (휠 스크롤로 숫자가 바뀌던 사고도 같이 사라진다) */
          '<input type="text" inputmode="decimal" class="ws-inp" id="wsA_'+q.key+'" placeholder="'+esc(q.placeholder||'')+(q.unit?' ('+esc(q.unit)+')':'')+'" />'+
          '<div class="ws-hint">💡 POS(인정 등)·카카오 예약 내역을 보고 실제 숫자를 입력하세요 · <strong>1,500</strong>처럼 적어도 괜찮아요</div>';
      } else {
        var min = q.min_len||0;
        field.innerHTML = label +
          '<textarea class="ws-inp" id="wsA_'+q.key+'" placeholder="'+esc(q.placeholder||'')+'" oninput="wsCount(this,\'wsCnt_'+q.key+'\','+min+')"></textarea>'+
          '<div class="ws-counter" id="wsCnt_'+q.key+'">0자'+(min?' (최소 '+min+'자)':'')+'</div>';
      }
      wrap.appendChild(field);
    });
    /* 이전에 쓰다 만 내용 복원 + 입력할 때마다 임시 저장 */
    wsRestoreDraft();
    questions.forEach(function(q){
      var el = document.getElementById('wsA_'+q.key);
      if(el) el.addEventListener('input', wsSaveDraft);
    });
  }

  /* 이메일 확인 → /verify (문항 받아옴) */
  window.wsCheckEmail = function(){
    hideErr(0);
    var inp=document.getElementById('wsEmail');
    state.email=inp.value.trim().toLowerCase();
    if(!state.email||state.email.indexOf('@')<0){showErr(0,'올바른 이메일을 입력해주세요.');return;}
    var p=PARTS[state.partIdx];
    var btn=document.getElementById('wsCheckBtn');
    btn.disabled=true;btn.innerHTML='<span class="ws-spinner"></span>확인 중...';
    fetch(API_URL+'/verify',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:state.email,part:p.num,lecture:state.lecture})
    })
    .then(function(r){return r.json()})
    .then(function(d){
      btn.disabled=false;btn.textContent='다음';
      /* /verify는 미등록·기간만료·3회소진·미준비강의(그리고 서버 500)를 전부 verified:false로 내려준다.
         예전엔 이 전부에 "내 정보 등록하러 가기" 링크가 붙어서, 3회를 다 쓴 학생이
         재등록만 반복하고 여전히 막히는 상황이 됐다. 등록이 실제 해법인 경우에만 링크를 준다.
         (서버가 reason 코드를 내려주는 게 정석이지만 워커는 이번 수정 범위 밖이라 메시지로 판별) */
      if(!d.verified){
        var vmsg = d.message || '아직 등록되지 않은 이메일이에요. 먼저 내 정보를 등록해주세요.';
        if(!d.message || /등록되지 않|등록해 ?주세요/.test(vmsg)) showRegisterGuide(0, vmsg);
        else showErr(0, vmsg);
        return;
      }
      // 프로필(닉네임·살롱) 미등록 → 등록 페이지 안내 + 링크
      if(d.needsProfile){ showRegisterGuide(0, '닉네임·살롱명 등록이 필요해요. 내 정보 등록을 먼저 해주세요.'); return; }
      /* 남은 횟수는 서버 값을 그대로 쓴다 — 제출하고 나서야 알던 걸 쓰기 전에 알려준다 */
      state.maxAttempts = d.maxAttempts || MAX_ATTEMPTS;
      state.attempt = d.nextAttempt || ((d.attempts||0) + 1);
      var leftAfter = state.maxAttempts - state.attempt;
      var noteEl = document.getElementById('wsAttemptNote');
      if(noteEl) noteEl.innerHTML = leftAfter > 0
        ? '이번이 <strong>'+state.attempt+'번째</strong> 제출이에요 · 제출 후 '+leftAfter+'회 더 쓸 수 있어요'
        : '<strong style="color:var(--ws-red)">이번이 마지막 제출이에요</strong> · 제출하면 이 강의는 다시 제출할 수 없어요';
      state.questions = d.questions||[];
      document.getElementById('wsUserName').textContent=d.name||'회원';
      renderQuestions(state.questions);
      wsGoStep(1);
    })
    .catch(function(){
      btn.disabled=false;btn.textContent='다음';
      showErr(0,'서버 연결에 실패했어요. 잠시 후 다시 시도해주세요.');
    });
  };

  /* 제출 → /submit */
  window.wsSubmit = function(){
    hideErr(1);
    var answers={}; var problem=''; var problemEl=null;
    state.questions.forEach(function(q, qi){
      var el=document.getElementById('wsA_'+q.key);
      var v=(el && el.value || '').trim();
      answers[q.key]=v;
      if(!v){ if(!problem){ problem='문항 '+(qi+1)+'을 작성해주세요.'; problemEl=el; } }
      else if(q.type!=='number' && q.min_len && v.length<q.min_len){ if(!problem){ problem='문항 '+(qi+1)+'을 최소 '+q.min_len+'자 이상 작성해주세요. (현재 '+v.length+'자)'; problemEl=el; } }
    });
    /* 여기서 return하면 서버 요청이 아예 나가지 않는다. 학생 눈엔 "버튼을 눌러도
       아무 반응 없음"으로 보이므로, 문제가 된 입력칸도 빨갛게 표시해 준다. */
    if(problem){
      if(problemEl) problemEl.classList.add('ws-inp-bad');
      showErr(1,problem);
      return;
    }
    var p=PARTS[state.partIdx];
    var btn=document.getElementById('wsSubmitBtn');
    btn.disabled=true;btn.innerHTML='<span class="ws-spinner"></span>제출 중...';
    fetch(API_URL+'/submit',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:state.email,part:p.num,lecture:state.lecture,answers:answers})
    })
    .then(function(r){return r.json()})
    .then(function(d){
      btn.disabled=false;btn.textContent='채점 받기';
      if(!d.success){showErr(1,d.message||'제출에 실패했어요.');return;}
      document.getElementById('wsDoneEmail').textContent=state.email;
      /* 소요시간 안내는 서버 문구를 그대로 — 화면은 "5~10분", 서버는 "1분 내"라고
         서로 다른 말을 하고 있었다 (cron은 매분 실행, 실측 1~2분) */
      var whenEl=document.getElementById('wsDoneWhen');
      if(whenEl && d.message) whenEl.textContent = d.message;
      var maxA = state.maxAttempts || MAX_ATTEMPTS;
      document.getElementById('wsRemain').textContent=Math.max(0, maxA-(d.attempts||1))+'회';
      wsMarkDone();
      wsClearDraft();
      wsGoStep(2);
    })
    .catch(function(){
      btn.disabled=false;btn.textContent='채점 받기';
      showErr(1,'서버 연결에 실패했어요. 잠시 후 다시 시도해주세요.');
    });
  };

  /* 엔터키 */
  document.getElementById('wsEmail').addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();wsCheckEmail();}
  });

})();
</script>

</body>
</html>
